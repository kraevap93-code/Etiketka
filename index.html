<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Единое Приложение</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Стили для общего вида страницы */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh; /* Занимаем всю высоту экрана */
            background-color: #27272a; /* Цвет фона из темной темы вашего примера */
        }

        /* Стили для верхнего меню (навигации) */
        .app-nav {
            background-color: transparent; /* Фон навигации теперь прозрачный, чтобы соответствовать фону страницы */
            padding: 15px 20px;
            display: flex;
            justify-content: center; /* Выравнивание кнопок по центру */
            gap: 15px; /* Немного уменьшим расстояние */
            flex-wrap: wrap; /* Добавлено для переноса ссылок на маленьких экранах */
            border-bottom: 1px solid #52525b; /* Цвет границы из темной темы для лучшего контраста */
        }
        .app-nav a {
            /* Стили для неактивных кнопок по умолчанию */
            background-color: transparent;
            color: #f4f4f5; /* Светлый текст для неактивных кнопок */
            
            /* Общие стили для всех кнопок */
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 8px;
            transition: background-color 0.2s, color 0.2s, filter 0.2s;
        }

        /* Эффект при наведении на НЕактивную кнопку */
        .app-nav a:hover:not(.active) {
            background-color: #3f3f46; /* Темно-серый фон при наведении */
        }
        
        /* Стиль ТОЛЬКО для активной кнопки */
        .app-nav a.active {
            background-color: #facc15; /* Желтый фон */
            color: #111827; /* Темный текст */
        }

        /* Эффект при наведении на активную кнопку */
        .app-nav a.active:hover {
            filter: brightness(0.9); /* Слегка затемняем желтый фон */
        }

        /* Стили для контейнера, в котором будет приложение */
        .app-container {
            flex-grow: 1; /* Занимает все оставшееся место */
            border: none; /* Убираем рамку у iframe */
        }
    </style>
</head>
<body>

    <nav class="app-nav">
        <a href="javascript:void(0);" onclick="loadApp('https://kraevap93-code.github.io/Sklad/', this)" class="active">Склад</a>
        <a href="javascript:void(0);" onclick="loadApp('https://kraevap93-code.github.io/Peredacha-smen/', this)">Передача смен</a>
        <a href="javascript:void(0);" onclick="loadApp('https://kraevap93-code.github.io/Klimat-GIP/', this)">Климат</a>
        <a href="javascript:void(0);" onclick="loadApp('https://kraevap93-code.github.io/Grafik/', this)">График</a>
    </nav>

    <iframe id="app-frame" class="app-container" src="https://kraevap93-code.github.io/Sklad/"></iframe>

    <script>
        const navLinks = document.querySelectorAll('.app-nav a');
        const appFrame = document.getElementById('app-frame');

        // Функция для загрузки приложения в iframe
        function loadApp(url, clickedLink) {
            // Устанавливаем URL для iframe
            appFrame.src = url;

            // Обновляем "активный" класс в меню
            navLinks.forEach(link => link.classList.remove('active'));
            clickedLink.classList.add('active');
        }
    </script>

</body>
</html>
