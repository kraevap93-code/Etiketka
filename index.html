                    currentUserEmail = user.email;
                    authWrapper.classList.add('hidden');
                    appContainer.classList.remove('hidden');
                    document.body.classList.add('p-4', 'md:p-8');
                    userEmailEl.textContent = user.email;
                    initializeAppLogic();
                } else {
                    currentUserEmail = null;
                    authWrapper.classList.remove('hidden');

                    if (unsubscribeHistory) unsubscribeHistory();
                }
            });

            showRegisterBtn.addEventListener('click', (e) => { e.preventDefault(); loginView.classList.add('hidden'); registerView.classList.remove('hidden'); });
            showLoginBtn.addEventListener('click', (e) => { e.preventDefault(); registerView.classList.add('hidden'); loginView.classList.remove('hidden'); });

                const email = document.getElementById('register-email').value;

                const password = document.getElementById('login-password').value;
                signInWithEmailAndPassword(auth, email, password).catch(handleAuthError(loginError));

            function handleAuthError(errorElement) {
                return function(error) {
                    console.error("Auth error:", error);

                    errorElement.classList.remove('hidden');
                }

            // --- Main App Logic Initializer ---
            function initializeAppLogic() {
                setupEventListeners();

            // --- Theme Toggle Logic ---
            function applyTheme() {
                if (themeToggle.checked) { // Light theme
                    docHtml.classList.add('light');
                    localStorage.setItem('theme', 'light');
                } else { // Dark theme
                    docHtml.classList.remove('light');
                    localStorage.setItem('theme', 'dark');
                }
            }
            if (localStorage.getItem('theme') === 'light') themeToggle.checked = true;
            else themeToggle.checked = false;
            applyTheme();
            themeToggle.addEventListener('change', applyTheme);
            
            // #############################################
            // #           REPAIR TASKS SECTION            #
            // #############################################
            const tasksDataRef = collection(db, \`artifacts/\${appId}/public/data/repair_tasks\`);
            const historyRef = collection(db, \`artifacts/\${appId}/public/data/repair_tasks_history\`);

            function listenForTasksChanges() {
                const q = query(tasksDataRef, orderBy('createdAt', 'desc'));
                unsubscribeTasks = onSnapshot(q, (snapshot) => {
                    allTasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderTasksTable();
                }, (error) => console.error("Error loading tasks:", error));
            }
            
            function renderTasksTable() {
                const tableBody = tasksTableBody;
                const loadingState = document.getElementById('tasks-loading');
                const tableContainer = document.getElementById('tasks-table-container');
                const searchDateVal = document.getElementById('search-date').value;

                // 1. Filter by current view (active/completed)
                let tasksToDisplay = allTasks.filter(task => {
                    return currentView === 'active' ? !task.isDone : task.isDone;
                });

                // 2. Filter by search date if provided
                if (searchDateVal) {
                    tasksToDisplay = tasksToDisplay.filter(task => {
                        if (task.createdAt && task.createdAt.toDate) {
                            const taskDate = task.createdAt.toDate().toISOString().split('T')[0];
                            return taskDate === searchDateVal;
                        }
                        return false;
                    });
                }
                
                tableBody.innerHTML = '';
                if (tasksToDisplay.length === 0) {
                    let msg = currentView === 'active' ? 'Нет активных задач.' : 'Нет выполненных задач.';
                     if (searchDateVal) {
                        const formattedDate = new Date(searchDateVal).toLocaleDateString('ru-RU');
                        msg += \` на \${formattedDate}\`;
                    }
                    loadingState.textContent = msg;
                    loadingState.classList.remove('hidden');
                    tableContainer.classList.add('hidden');
                    return;
                }
                
                loadingState.classList.add('hidden');
                tableContainer.classList.remove('hidden');
                
                const groupedData = tasksToDisplay.reduce((acc, task) => {
                    if (task.createdAt && task.createdAt.toDate) {
                        const dateKey = task.createdAt.toDate().toISOString().split('T')[0];
                        if (!acc[dateKey]) {
                            acc[dateKey] = [];
                        }
                        acc[dateKey].push(task);
                    }
                    return acc;
                }, {});

                const sortedDates = Object.keys(groupedData).sort((a, b) => new Date(b) - new Date(a));

                sortedDates.forEach(dateKey => {
                    const date = new Date(dateKey);
                    const formattedDate = date.toLocaleDateString('ru-RU', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                    const dateRow = document.createElement('tr');
                    dateRow.innerHTML = \`<td colspan="7" class="px-6 py-2 text-sm font-semibold" style="background-color: var(--date-header-bg);">\${formattedDate}</td>\`;
                    tableBody.appendChild(dateRow);

                    const tasksForDay = groupedData[dateKey];
                    tasksForDay.forEach(task => {
                        const row = document.createElement('tr');
                        row.style.transition = 'background-color 0.3s';
                        row.addEventListener('mouseover', () => { row.style.backgroundColor = 'var(--hover-bg)'; });
                        row.addEventListener('mouseout', () => { row.style.backgroundColor = 'transparent'; });

                        const descriptionHtml = \`

                            \${task.mediaLink ? \`

                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                        <path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" />
                                    </svg>
                                    Посмотреть вложение
                                </a>\` : ''}
                        \`;

                        const engineerResponseHtml = \`
                            <div class="whitespace-pre-wrap">\${task.engineerResponse || '---'}</div>
                             \${task.engineerMediaLink ? \`
                                <a href="\${task.engineerMediaLink}" target="_blank" rel="noopener noreferrer" class="mt-2 inline-flex items-center gap-x-2 text-sm rounded-md p-2 font-semibold bg-blue-500 bg-opacity-10 text-blue-400 hover:bg-opacity-20 transition">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                        <path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" />
                                    </svg>
                                    Посмотреть вложение
                                </a>\` : ''}
                        \`;

                        row.innerHTML = \`
                            <td class="px-6 py-4 text-center">
                                <input type="checkbox" data-id="\${task.id}" class="custom-checkbox status-checkbox" \${task.isDone ? 'checked' : ''}>
                            </td>
                            <td class="px-6 py-4 text-sm"><span class="urgency-badge urgency-\${task.urgency}">\${task.urgency}</span></td>
                            <td class="px-6 py-4 text-sm">\${task.author}</td>
                            <td class="px-6 py-4 text-sm text-center">\${task.hours}</td>
                            <td class="px-6 py-4 text-sm align-top">\${descriptionHtml}</td>
                            <td class="px-6 py-4 text-sm align-top">\${engineerResponseHtml}</td>
                            <td class="px-6 py-4 text-center align-middle text-sm">

                                    </button>
                                    <button data-id="\${task.id}" class="delete-btn p-1 hover:text-red-500" title="Удалить">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                    </button>

                        tableBody.appendChild(row);

            async function handleAddTask(e) {
                e.preventDefault();
                
                const newTaskData = {
                    author: document.getElementById('task-author').value,
                    urgency: document.getElementById('task-urgency').value,
                    hours: parseFloat(document.getElementById('task-hours').value),
                    description: document.getElementById('task-description').value,
                    mediaLink: document.getElementById('task-media-link').value.trim() || "",
                    isDone: false,
                    engineerResponse: "",
                    engineerMediaLink: "",
                    authorResponse: "",
                    createdAt: serverTimestamp()
                };

                try {
                    const docRef = await addDoc(tasksDataRef, newTaskData);
                    const logDetails = { ...newTaskData };
                    delete logDetails.createdAt;
                    await logHistory('create', docRef.id, { newData: logDetails });
                    e.target.reset();
                    document.getElementById('task-urgency').value = 'средняя';
                } catch (error) {
                    console.error("Failed to add task:", error);
                }
            }

                console.log("Tasks collection is empty. Seeding initial data...");

                    mediaLink: "",

                    engineerMediaLink: "",
                    authorResponse: ""

                    await addDoc(tasksDataRef, initialTask);

            // #############################################
            // #        GENERAL & SHARED SECTION           #
            // #############################################
            
            function setupEventListeners() {
                addTaskForm.addEventListener('submit', handleAddTask);
                tasksTableBody.addEventListener('click', handleTableActions);

                // Search Listeners
                document.getElementById('search-btn').addEventListener('click', renderTasksTable);
                document.getElementById('reset-btn').addEventListener('click', () => {
                    document.getElementById('search-date').value = '';
                    renderTasksTable();
                });

                // Tabs listener
                document.querySelector('nav[aria-label="Tabs"]').addEventListener('click', e => {
                    const target = e.target.closest('button.tab-btn');
                    if (target && !target.classList.contains('active')) {
                        currentView = target.dataset.view;
                        document.querySelector('.tab-btn.active').classList.remove('active');
                        target.classList.add('active');
                        document.getElementById('search-date').value = ''; // Clear date search on tab switch
                        renderTasksTable(); // Re-render with new view filter
                    }
                });

                // History Listeners
                historyBtn.addEventListener('click', showHistoryView);

                    historyView.classList.add('hidden');

                });

                confirmCancelBtn.addEventListener('click', () => confirmModal.classList.add('hidden'));

                // Edit modal listeners
                editForm.addEventListener('submit', handleUpdateEntry);
                editCancelBtn.addEventListener('click', () => editModal.classList.add('hidden'));
            }

            function handleTableActions(e) {
                const target = e.target;
                const docId = target.dataset.id;

                if (target.classList.contains('status-checkbox')) {
                    handleStatusChange(docId, target.checked);
                    return;
                }

                const button = target.closest('button');
                if (!button) return;
                
                const id = button.dataset.id;

                if (button.classList.contains('delete-btn')) {
                    itemToDeleteContext = { id };
                    confirmModal.classList.remove('hidden');
                } else if (button.classList.contains('edit-btn')) {
                    openEditModal(id);
                }
            }
            
            async function handleStatusChange(docId, isDone) {
                const docRef = doc(tasksDataRef, docId);
                const task = allTasks.find(t => t.id === docId);
                if (!task) return;
                
                const oldData = { ...task };
                const newData = { ...task, isDone };

                try {
                    await updateDoc(docRef, { isDone: isDone });
                    await logHistory('update', docId, { oldData, newData });
                } catch (error) {
                    console.error("Error updating status:", error);
                    // Revert checkbox on error
                    const checkbox = tasksTableBody.querySelector(\`.status-checkbox[data-id="\${docId}"]\`);
                    if(checkbox) checkbox.checked = !isDone;
                }
            }

                            <label for="edit-task-author-response" class="block text-sm font-medium text-secondary">Ответ автора</label>

                    editModal.classList.remove('hidden');

                } catch (error) {
                    console.error("Error fetching document for edit:", error);
                }
            }
            
            async function handleUpdateEntry(e) {
                e.preventDefault();
                const { id, data: oldData } = itemToEditContext;
                if (!id) return;

                const newData = {
                    author: document.getElementById('edit-task-author').value,
                    urgency: document.getElementById('edit-task-urgency').value,
                    hours: parseFloat(document.getElementById('edit-task-hours').value),
                    description: document.getElementById('edit-task-description').value,
                    mediaLink: document.getElementById('edit-task-media-link').value.trim() || "",
                    engineerResponse: document.getElementById('edit-task-engineer-response').value,
                    engineerMediaLink: document.getElementById('edit-engineer-media-link').value.trim() || "",
                    authorResponse: document.getElementById('edit-task-author-response').value,
                    isDone: document.getElementById('edit-task-isDone').checked
                };
                
                const docRef = doc(tasksDataRef, id);

                try {
                    await updateDoc(docRef, newData);
                    await logHistory('update', id, { oldData, newData: { ...oldData, ...newData } }); // merge to include createdAt
                } catch (error) {
                    console.error("Failed to update entry:", error);
                } finally {
                    editModal.classList.add('hidden');
                    itemToEditContext = { id: null, data: null };
                }
            }

            function handleConfirmDelete() {
                const { id } = itemToDeleteContext;
                if (id) {
                    handleDeleteTask(id);
                }
                confirmModal.classList.add('hidden');
                itemToEditContext = { id: null }; 
            }

            async function handleDeleteTask(docId) {
                const docRef = doc(tasksDataRef, docId);
                try {
                    const docSnap = await getDoc(docRef);
                    if(!docSnap.exists()) return;
                    const deletedData = docSnap.data();
                    await deleteDoc(docRef);
                    await logHistory('delete', docId, { deletedData });
                } catch(error) {
                    console.error("Failed to delete task:", error);
                }
            }

            // --- History & Search ---
            function showHistoryView() {
                mainView.classList.add('hidden');
                historyView.classList.remove('hidden');
                initializeHistoryView();
            }
            
            function initializeHistoryView() {
                const q = query(historyRef, orderBy('timestamp', 'desc'));
                unsubscribeHistory = onSnapshot(q, (snapshot) => {
                    renderHistory(snapshot.docs.map(doc => doc.data()));
                });
            }

            async function logHistory(action, docId, details) {
                const sanitizeData = (data) => {
                    if (!data) return data;
                    const sanitized = { ...data };
                    if (sanitized.createdAt?.toDate) {
                        sanitized.createdAt = sanitized.createdAt.toDate().toISOString();
                    }
                    return sanitized;
                };

                const logData = {};
                if (details.oldData) logData.oldData = sanitizeData(details.oldData);
                if (details.newData) logData.newData = sanitizeData(details.newData);
                if (details.deletedData) logData.deletedData = sanitizeData(details.deletedData);

                try {
                    await addDoc(historyRef, { 
                        action, 
                        docId, 
                        details: logData, 
                        userEmail: currentUserEmail, 
                        timestamp: serverTimestamp() 
                    });
                } catch(error) { console.error("Failed to log history:", error); }
            }

            function renderHistory(historyData) {
                historyTableBody.innerHTML = '';
                if (historyData.length === 0) {
                    historyTableBody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-secondary">История изменений пуста.</td></tr>';
                    return;
                }
                historyData.forEach(log => {
                    const row = document.createElement('tr');
                    const date = log.timestamp?.toDate ? log.timestamp.toDate().toLocaleString('ru-RU') : 'N/A';
                    let detailsHtml = '';

                    if (log.action === 'create' && log.details?.newData) {
                        detailsHtml = \`Создана задача: "\${log.details.newData.description || ''}"\`;
                    } else if (log.action === 'delete' && log.details?.deletedData) {
                        detailsHtml = \`Удалена задача: "\${log.details.deletedData.description || ''}"\`;
                    } else if (log.action === 'update' && log.details?.newData && log.details?.oldData) {
                        const changes = Object.keys(log.details.newData).reduce((acc, key) => {
                            if (key === 'createdAt') return acc;
                            const oldValue = log.details.oldData[key] ?? 'пусто';
                            const newValue = log.details.newData[key] ?? 'пусто';
                            
                            if (String(oldValue) !== String(newValue)) {
                                acc.push(\`<b>\${key}</b>: "\${oldValue}" -> "\${newValue}"\`);
                            }
                            return acc;
                        }, []);
                        detailsHtml = changes.length > 0 ? \`Обновлено: \${changes.join('<br>')}\` : 'Запись обновлена (без изменений).';
                    } else {
                        detailsHtml = \`Действие "\${log.action}" (нет деталей)\`;
                    }

                    row.innerHTML = \`
                        <td class="px-6 py-4 whitespace-nowrap text-sm">\${date}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-secondary">\${log.userEmail}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-secondary">\${log.action}</td>
                        <td class="px-6 py-4 text-sm text-secondary">\${detailsHtml}</td>\`;
                    historyTableBody.appendChild(row);
                });
            }
        });
    <\/script>
</body>
</html>
        `;

        // Обновленная функция для загрузки приложения
        function loadApp(source, clickedLink) {
            // Если источник - 'local', загружаем HTML-код журнала в iframe
            if (source === 'local') {
                appFrame.srcdoc = repairLogAppHtml;
                appFrame.src = ''; // Очищаем src, чтобы srcdoc имел приоритет
            } 
            // Иначе, загружаем внешний URL
            else {
                appFrame.src = source;
                appFrame.srcdoc = ''; // Очищаем srcdoc
            }

            // Обновляем "активный" класс в меню
            navLinks.forEach(link => link.classList.remove('active'));
            clickedLink.classList.add('active');
        }
    </script>
</body>
</html>
