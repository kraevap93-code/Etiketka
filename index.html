<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiketka</title>
    <!-- Иконка из оригинальной программы -->
    <link rel="icon" href="https://kraevap93-code.github.io/Etiketka/logo4c.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS переменные для управления темой */
         :root {
            --bg-color: #27272a;
            --card-bg-color: #3f3f46;
            --text-primary: #f4f4f5;
            --border-color: #52525b;
        }

        html.light {
            --bg-color: #f9fafb;
            --card-bg-color: #ffffff;
            --text-primary: #111827;
            --border-color: #d1d5db;
        }
        
        /* Стили для общего вида страницы */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh; 
            background-color: var(--bg-color); 
        }

        /* Стили для верхнего меню (навигации) */
        .app-nav {
            background-color: transparent;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-color);
        }
        .app-nav a {
            background-color: transparent;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 8px;
            transition: background-color 0.2s, color 0.2s, filter 0.2s;
        }

        .app-nav a:hover:not(.active) {
            background-color: var(--card-bg-color);
        }
        
        .app-nav a.active {
            background-color: #facc15; /* Желтый фон */
            color: #111827; /* Темный текст */
        }

        .app-nav a.active:hover {
            filter: brightness(0.9);
        }

        /* Стили для контейнера, в котором будет приложение */
        .app-container {
            flex-grow: 1; /* Занимает все оставшееся место */
            border: none; /* Убираем рамку у iframe */
            background-color: var(--bg-color); /* Фон для iframe, чтобы не было белой вспышки */
        }
    </style>
</head>
<body>
    <nav class="app-nav">
        <a href="javascript:void(0);" onclick="loadApp('https://kraevap93-code.github.io/Sklad/', this)" class="active">Склад</a>
        <a href="javascript:void(0);" onclick="loadApp('https://kraevap93-code.github.io/Peredacha-smen/', this)">Передача смен</a>
        <a href="javascript:void(0);" onclick="loadApp('https://kraevap93-code.github.io/Klimat-GIP/', this)">Климат</a>
        <a href="javascript:void(0);" onclick="loadApp('https://kraevap93-code.github.io/Schetchik-cifra/', this)">Счетчик цифра</a>
        <a href="javascript:void(0);" onclick="loadApp('https://kraevap93-code.github.io/Grafik/', this)">График</a>
        <a href="javascript:void(0);" onclick="loadApp('https://kraevap93-code.github.io/Kalkulyator/', this)">Калькулятор</a>
        <a href="javascript:void(0);" onclick="loadApp('https://kraevap93-code.github.io/RemontrabotaRazina/', this)">Заявки на ремонт</a>
    </nav>

    <iframe id="app-frame" class="app-container" src="https://kraevap93-code.github.io/Sklad/"></iframe>

    <script>
        const navLinks = document.querySelectorAll('.app-nav a');
        const appFrame = document.getElementById('app-frame');

        // Упрощенная функция для загрузки приложений по URL
        function loadApp(url, clickedLink) {
            appFrame.src = url;

            // Обновляем "активный" класс в меню
            navLinks.forEach(link => link.classList.remove('active'));
            clickedLink.classList.add('active');
        }
    </script>
</body>
</html>
